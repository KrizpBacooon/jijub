<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Preferencias de Entretenimiento 🍿</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>🎬 Preferencias de Entretenimiento 🎬</h1>
        <form id="entertainmentForm">
            <div class="form-group">
                <label for="nombre">1. ¿Cuál es tu nombre?</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>
            
            <div class="form-group">
                <label for="genero">2. ¿Cuál es tu género de película favorito?</label>
                <select id="genero" name="genero" required>
                    <option value="">Selecciona una opción</option>
                    <option value="accion">Acción</option>
                    <option value="comedia">Comedia</option>
                    <option value="drama">Drama</option>
                    <option value="terror">Terror</option>
                    <option value="ciencia-ficcion">Ciencia Ficción</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="plataforma">3. ¿Cuál es tu plataforma de streaming preferida?</label>
                <div class="radio-group">
                    <label><input type="radio" name="plataforma" value="netflix" required> Netflix</label>
                    <label><input type="radio" name="plataforma" value="amazon"> Amazon Prime</label>
                    <label><input type="radio" name="plataforma" value="disney"> Disney+</label>
                    <label><input type="radio" name="plataforma" value="hbo"> HBO Max</label>
                </div>
            </div>
            
            <div class="form-group">
                <label for="frecuencia">4. ¿Con qué frecuencia ves películas?</label>
                <select id="frecuencia" name="frecuencia" required>
                    <option value="">Selecciona una opción</option>
                    <option value="diariamente">Diariamente</option>
                    <option value="semanalmente">Semanalmente</option>
                    <option value="mensualmente">Mensualmente</option>
                    <option value="ocasionalmente">Ocasionalmente</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>5. ¿Recomendarías tus preferencias a un amigo?</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="recomendar" value="si"> Sí</label>
                    <label><input type="checkbox" name="recomendar" value="no"> No</label>
                </div>
            </div>
            
            <div class="form-group">
                <label for="serie">6. ¿Cuál es tu serie favorita de todos los tiempos?</label>
                <input type="text" id="serie" name="serie" required>
            </div>
            
            <div class="form-group">
                <label for="tiempo">7. ¿Cuántas horas a la semana dedicas a ver contenido?</label>
                <select id="tiempo" name="tiempo" required>
                    <option value="">Selecciona una opción</option>
                    <option value="menos-5">Menos de 5 horas</option>
                    <option value="5-10">5 a 10 horas</option>
                    <option value="10-20">10 a 20 horas</option>
                    <option value="mas-20">Más de 20 horas</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="dispositivo">8. ¿En qué dispositivo ves contenido principalmente?</label>
                <div class="radio-group">
                    <label><input type="radio" name="dispositivo" value="tv" required> Televisor</label>
                    <label><input type="radio" name="dispositivo" value="celular"> Celular</label>
                    <label><input type="radio" name="dispositivo" value="laptop"> Laptop</label>
                    <label><input type="radio" name="dispositivo" value="tablet"> Tablet</label>
                </div>
            </div>
            
            <div class="form-group">
                <label>9. ¿Qué tipos de contenido te gustan?</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="contenido" value="peliculas"> Películas</label>
                    <label><input type="checkbox" name="contenido" value="series"> Series</label>
                    <label><input type="checkbox" name="contenido" value="documentales"> Documentales</label>
                    <label><input type="checkbox" name="contenido" value="anime"> Anime</label>
                </div>
            </div>
            
            <div class="form-group">
                <label for="edad">10. ¿Cuántos años tienes?</label>
                <input type="number" id="edad" name="edad" min="1" max="120" required>
            </div>
            
            <button type="submit">Enviar</button>
        </form>
        
        <div id="resultado" class="resultado"></div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
